services:
  critterbox:
    image: nginx:alpine
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - dev_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.critterbox.rule=Host(`critters.dev.kkhost.pl`)"
      - "traefik.http.routers.critterbox.entrypoints=web"
      - "traefik.http.services.critterbox.loadbalancer.server.port=80"

networks:
  dev_net:
    external: true
